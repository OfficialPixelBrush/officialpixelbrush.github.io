<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0">
  <script>
    const target = "https://openbetagroup.github.io/beta-wiki";
    const path = window.location.pathname;
    const suffix = path.replace(/^\/beta-wiki\/?/, "");

    window.location.replace(
      target + "/" + suffix + window.location.search + window.location.hash
    );
  </script>
</head>
<body></body>
</html>
